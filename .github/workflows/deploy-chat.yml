name: Validate Chat

on:
  pull_request:
    paths:
      - "apps/chat/**"
      - "packages/chat-client/**"
      - "packages/contracts/**"
      - ".github/workflows/deploy-chat.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run build:chat
      - run: node --check apps/chat/dist/app.js

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run build:chat
      - name: Deploy chat to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy apps/chat/dist --project-name=stexpedite-chat --branch=main --commit-dirty=true
