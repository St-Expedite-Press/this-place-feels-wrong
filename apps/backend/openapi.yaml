openapi: 3.1.0
info:
  title: St. Expedite Press Communications API
  version: 1.12.0
  description: |
    Cloudflare Worker API for public chat, contact, submission, donation, storefront, projects, updates signup, and owner admin flows.
    Source implementation: apps/backend/src/index.ts
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: St. Expedite Press
    email: editor@stexpedite.press
    url: https://stexpedite.press
security: []
servers:
  - url: https://stexpedite.press
    description: Production
  - url: https://stexpedite-communications.stexpedite-communications.workers.dev
    description: Worker direct endpoint (testing)
paths:
  /api/health:
    get:
      tags: [health]
      summary: Worker runtime health probe
      operationId: getHealth
      responses:
        "200":
          description: Worker is running and returns runtime dependency flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"
  /api/storefront:
    get:
      tags: [storefront]
      summary: Read public Fourthwall storefront catalog snapshot
      operationId: getStorefront
      parameters:
        - in: query
          name: collection
          required: false
          schema:
            type: string
          description: Collection slug (defaults to `all` or first available collection)
      responses:
        "200":
          description: Storefront catalog snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontSuccess"
        "500":
          description: Storefront token is not configured in Worker environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream Fourthwall API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/projects:
    get:
      tags: [projects]
      summary: Read the canonical projects program list
      operationId: getProjects
      responses:
        "200":
          description: Program and project list from D1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectsSuccess"
        "500":
          description: DB binding missing or projects table unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/works:
    get:
      tags: [works]
      summary: Read the unified works list (St. Expedite books + RICE editorial works)
      operationId: getWorks
      parameters:
        - in: query
          name: program
          required: false
          schema: { type: string }
          description: Filter by program_key (e.g. rice)
        - in: query
          name: kind
          required: false
          schema: { type: string }
          description: Filter by kind (book, essay, fiction, poetry, photo, archive, issue)
      responses:
        "200":
          description: Unified works list from D1 (works, series, totals)
          content:
            application/json:
              schema:
                type: object
        "500":
          description: DB binding missing or works table unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/chat:
    post:
      tags: [chat]
      summary: Stream a public, constrained Hermes chat response
      operationId: streamPublicChat
      description: |
        Accepts an alternating conversation that starts and ends with a user message. `assistant` messages
        must be plain string content. `user` messages may be plain string content, or (only on the final
        message in the array) an array of 1-2 content parts: at most one `text` part and at most one
        `image_url` part, letting a visitor attach one image to their current message. Image URLs must be
        inline `data:image/{jpeg,png,webp,gif};base64,...` URIs no larger than 4 MiB decoded — remote
        `https://` image URLs are rejected by design, to avoid the Worker acting as a URL-fetch proxy. Images
        are only accepted on the last message because the client resends full history each turn; an image on
        an earlier message would mean re-transmitting its bytes on every subsequent request. The Worker
        selects a server-owned chatbot instruction from the validated surface: publication guidance for `stex`
        and `rice`, and a general-purpose text assistant for `openui`. The Worker supplies Hermes authorization
        and never forwards browser authorization headers or client-provided system messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Hermes server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid JSON, roles, message ordering, fields, or content limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Turnstile verification failed (only when configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request body exceeds 6 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"
        "502":
          description: Hermes request failed or did not return an SSE stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Hermes endpoint or server credential is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/chat/history:
    get:
      tags: [chat]
      summary: Read a persisted conversation transcript by its client-generated id
      operationId: getChatHistory
      description: |
        Anonymous, unauthenticated by design — the conversationId itself (a 8-64 char opaque
        client-generated token) is the only access control, the same trust model as an unlisted
        share link. Returns an empty list for an unknown id rather than a 404, so a client can't
        distinguish "never existed" from "purged by retention" from "never persisted" (no
        conversationId was sent on the original /api/chat calls).
      parameters:
        - in: query
          name: conversationId
          required: true
          schema: { type: string, minLength: 8, maxLength: 64 }
      responses:
        "200":
          description: Ordered transcript (oldest first), possibly empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistorySuccess"
        "400":
          description: Malformed conversationId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contact:
    post:
      tags: [contact]
      summary: Submit contact form
      operationId: submitContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "200":
          description: Submission accepted and emails sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSuccess"
        "400":
          description: Invalid JSON or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Turnstile verification failed (only when configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"
        "500":
          description: Worker not configured, or unexpected runtime failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/submit:
    post:
      tags: [submit]
      summary: Submit inquiry form
      operationId: submitInquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SubmissionUploadRequest"
      responses:
        "200":
          description: Inquiry accepted and emails sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitSuccess"
        "400":
          description: Invalid JSON or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Turnstile verification failed (only when configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Submission upload exceeds the 10 MiB file limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"
        "500":
          description: Worker not configured, or unexpected runtime failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/donate/session:
    post:
      tags: [donations]
      summary: Create a Stripe Checkout session for a one-time donation
      operationId: createDonationSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationSessionRequest"
      responses:
        "200":
          description: Stripe Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationSessionSuccess"
        "400":
          description: Invalid JSON or donation amount outside accepted bounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Turnstile verification failed (only when configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"
        "500":
          description: Stripe not configured, or unexpected runtime failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Stripe session response did not contain a checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/stripe/webhook:
    post:
      tags: [donations]
      summary: Stripe webhook event receiver
      operationId: receiveStripeWebhook
      description: |
        Called directly by Stripe (server-to-server). Not a browser endpoint — no CORS, no rate limiting.
        Verifies the `Stripe-Signature` header using HMAC-SHA256.
        Handles `checkout.session.completed` — sends receipt to donor, sends notification to editor, logs to D1 `donations` table.
        Requires `STRIPE_WEBHOOK_SECRET` worker secret.
        Configure at: dashboard.stripe.com → Developers → Webhooks → Add endpoint → `https://stexpedite.press/api/stripe/webhook`.
        Events to send: `checkout.session.completed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload (verified via Stripe-Signature header)
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema:
            type: string
          description: Stripe webhook signature header (`t=TIMESTAMP,v1=SIGNATURE`)
      responses:
        "200":
          description: Event received and processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  received: { type: boolean }
        "400":
          description: Invalid signature or payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: STRIPE_WEBHOOK_SECRET not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/updates:
    post:
      tags: [updates]
      summary: Capture updates signup email
      operationId: captureUpdatesSignup
      description: |
        Writes to D1 (`updates_signups`) when DB binding is configured.
        Public route for first-party signup capture only.
        Browser CORS allows the St. Expedite Press origins, the RICE GitHub
        Pages origin (`https://st-expedite-press.github.io`), and localhost
        development origins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatesRequest"
      responses:
        "200":
          description: Signup recorded or refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatesSuccess"
        "400":
          description: Invalid JSON or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Turnstile verification failed (only when configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"
        "500":
          description: DB binding not configured, or unexpected runtime failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/updates/unsubscribe:
    post:
      tags: [updates]
      summary: Mark an updates signup as unsubscribed
      operationId: unsubscribeUpdatesSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatesUnsubscribeRequest"
      responses:
        "200":
          description: Email marked unsubscribed when present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatesUnsubscribeSuccess"
        "400":
          description: Invalid JSON or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Turnstile verification failed (only when configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"
        "500":
          description: DB binding not configured, or unexpected runtime failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/updates/import:
    post:
      tags: [updates]
      summary: Import updates enrichment payload
      operationId: importUpdatesEnrichment
      description: |
        Authenticated administrative route for applying subscriber enrichment fields.
        Requires `x-import-token` to match the Worker secret `UPDATES_IMPORT_TOKEN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatesImportRequest"
      responses:
        "200":
          description: Enrichment imported
          content:
            application/json:
              schema:
                type: object
                required: [ok, imported]
                properties:
                  ok:
                    type: boolean
                    const: true
                  imported:
                    type: boolean
                    const: true
        "400":
          description: Invalid JSON or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid import auth token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"
        "500":
          description: DB binding not configured, or unexpected runtime failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/login:
    post:
      tags: [admin]
      summary: Request an owner magic-link sign-in email
      operationId: adminLogin
      description: |
        Always returns `{ ok: true, sent: true }` regardless of whether the
        submitted email matches the Worker's configured `OWNER_EMAIL`, so this
        route cannot be used to confirm the owner's address. A login link is
        only actually emailed on a match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Request accepted (email sent only if the address matched)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginSuccess"
        "400":
          description: Invalid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/verify:
    get:
      tags: [admin]
      summary: Consume a single-use magic-link token and start an owner session
      operationId: adminVerify
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Valid token — session cookie set, redirects to ADMIN_APP_URL
        "401":
          description: Token missing, unknown, already used, or expired
          content:
            text/plain:
              schema: { type: string }
  /api/admin/me:
    get:
      tags: [admin]
      summary: Check whether the current request carries a valid owner session
      operationId: adminMe
      responses:
        "200":
          description: Always 200; `authenticated` reflects session validity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMeSuccess"
  /api/admin/logout:
    post:
      tags: [admin]
      summary: End the current owner session
      operationId: adminLogout
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Session (if any) deleted and cookie cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLogoutSuccess"
  /api/admin/signups:
    get:
      tags: [admin]
      summary: Read the updates_signups table
      operationId: adminSignups
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminLimit"
        - $ref: "#/components/parameters/AdminOffset"
      responses:
        "200":
          description: Signup rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRowsSuccess"
        "401":
          description: No valid owner session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/submissions:
    get:
      tags: [admin]
      summary: Read the contact_submissions table (metadata only, never manuscript contents)
      operationId: adminSubmissions
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminLimit"
        - $ref: "#/components/parameters/AdminOffset"
      responses:
        "200":
          description: Submission rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRowsSuccess"
        "401":
          description: No valid owner session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/donations:
    get:
      tags: [admin]
      summary: Read the donations table
      operationId: adminDonations
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminLimit"
        - $ref: "#/components/parameters/AdminOffset"
      responses:
        "200":
          description: Donation rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRowsSuccess"
        "401":
          description: No valid owner session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/visitor/login:
    post:
      tags: [visitor]
      summary: Request a visitor magic-link sign-in email
      description: Any valid email may sign up. Always returns { ok, sent:true }; a suspended account gets a silent no-op.
      responses:
        "200": { description: Accepted }
  /api/visitor/verify:
    get:
      tags: [visitor]
      summary: Consume a visitor magic-link token, create the account on first login, set the session cookie
      parameters: [{ in: query, name: token, required: true, schema: { type: string } }]
      responses:
        "302": { description: Valid — cookie set, redirect to CHAT_APP_URL }
        "401": { description: Invalid/expired/used token, or suspended account }
  /api/visitor/me:
    get:
      tags: [visitor]
      summary: Report whether the request carries a valid visitor session
      responses:
        "200": { description: "{ authenticated, email }" }
  /api/visitor/logout:
    post:
      tags: [visitor]
      summary: End the current visitor session
      responses:
        "200": { description: Session cleared }
  /api/presets:
    get:
      tags: [presets]
      summary: List presets — approved ones for everyone, plus the caller's own drafts when signed in
      responses:
        "200": { description: "{ presets: [...] }" }
  /api/preset-models:
    get:
      tags: [presets]
      summary: List owner-enabled models available to presets (visitor-gated)
      security: [{ visitorSession: [] }]
      responses:
        "200": { description: "{ models: [{id,label}] }" }
        "401": { description: No visitor session }
  /api/presets/create:
    post:
      tags: [presets]
      summary: Create a private draft preset (visitor-gated). Steps reference model_id from the allow-list.
      security: [{ visitorSession: [] }]
      responses:
        "200": { description: "{ id, status: draft }" }
        "400": { description: Invalid preset or unknown/disabled model }
        "401": { description: No visitor session }
  /api/presets/import:
    post:
      tags: [presets]
      summary: Import a portable preset packet as a private draft, mapping model_ref labels to allow-listed models
      security: [{ visitorSession: [] }]
      responses:
        "200": { description: "{ id, status: draft }" }
        "400": { description: Invalid packet or unknown model_ref }
        "401": { description: No visitor session }
  /api/presets/{id}/export:
    get:
      tags: [presets]
      summary: Export a preset as a portable packet (own preset, or any approved one). model_ref carries the public label, not the internal upstream ref.
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: preset packet }
        "404": { description: Not available }
  /api/presets/{id}/submit:
    post:
      tags: [presets]
      summary: Submit the caller's own draft/rejected preset for owner review (→ pending)
      security: [{ visitorSession: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ status }" }
        "401": { description: No visitor session }
        "404": { description: Not the caller's preset }
  /api/admin/presets/pending:
    get:
      tags: [admin]
      summary: List presets awaiting moderation (owner-gated)
      security: [{ ownerSession: [] }]
      responses:
        "200": { description: rows }
        "401": { description: No owner session }
  /api/admin/presets/{id}/detail:
    get:
      tags: [admin]
      summary: Owner view of any preset (packet) for review
      security: [{ ownerSession: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: preset packet }
  /api/admin/presets/{id}/moderate:
    post:
      tags: [admin]
      summary: Approve or reject a preset (owner-gated); logged to preset_moderation
      security: [{ ownerSession: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ status }" }
        "400": { description: Invalid action }
        "401": { description: No owner session }
  /api/admin/models:
    get:
      tags: [admin]
      summary: List the full model allow-list incl. disabled (owner-gated)
      security: [{ ownerSession: [] }]
      responses:
        "200": { description: rows }
    post:
      tags: [admin]
      summary: Add or update an allow-listed model (owner-gated)
      security: [{ ownerSession: [] }]
      responses:
        "200": { description: "{ id }" }
  /api/admin/models/{id}/toggle:
    post:
      tags: [admin]
      summary: Enable/disable an allow-listed model (owner-gated)
      security: [{ ownerSession: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ id, enabled }" }
  /api/admin/visitors/{id}/status:
    post:
      tags: [admin]
      summary: Set a visitor account active/suspended (owner-gated). Suspending un-approves that account's public presets.
      security: [{ ownerSession: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ id, status }" }
  /api/admin/graph/build:
    post:
      tags: [admin]
      summary: Owner-triggered knowledge-graph extraction over the works catalog (OpenRouter). Rebuilds kb_entities/kb_relations.
      security: [{ ownerSession: [] }]
      responses:
        "200": { description: "{ built, entities, relations }" }
        "502": { description: Extraction failed }
  /api/admin/graph/export:
    get:
      tags: [admin]
      summary: Export the knowledge graph as a portable packet (owner-gated)
      security: [{ ownerSession: [] }]
      responses:
        "200": { description: knowledge-graph packet }
  /api/admin/graph/import:
    post:
      tags: [admin]
      summary: Replace the knowledge graph from a portable packet (owner-gated). Dangling relations are dropped.
      security: [{ ownerSession: [] }]
      responses:
        "200": { description: "{ imported, entities, relations }" }
components:
  parameters:
    AdminLimit:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    AdminOffset:
      in: query
      name: offset
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: stex_owner_session
      description: Set by GET /api/admin/verify after a successful magic-link login.
    visitorSession:
      type: apiKey
      in: cookie
      name: stex_visitor_session
      description: Set by GET /api/visitor/verify after a successful visitor magic-link login.
  schemas:
    ChatTextPart:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
          minLength: 1
          maxLength: 4000
    ChatImagePart:
      type: object
      additionalProperties: false
      required: [type, image_url]
      properties:
        type:
          type: string
          enum: [image_url]
        image_url:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url:
              type: string
              description: Inline `data:image/{jpeg,png,webp,gif};base64,...` URI only, max 4 MiB decoded. Remote URLs are rejected.
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          description: |
            Plain string for any message. On `user` messages only, and only when this is the last
            message in the request, content may instead be an array of 1-2 parts (at most one `text`,
            at most one `image_url`) to attach an image. `assistant` messages must always be a plain string.
          oneOf:
            - type: string
              minLength: 1
              maxLength: 4000
            - type: array
              minItems: 1
              maxItems: 2
              items:
                oneOf:
                  - $ref: "#/components/schemas/ChatTextPart"
                  - $ref: "#/components/schemas/ChatImagePart"
    ChatRequest:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        surface:
          type: string
          enum: [stex, rice, openui]
          description: Optional public client surface; validated against the request origin when present
        messages:
          type: array
          minItems: 1
          maxItems: 12
          description: Alternating user/assistant history, beginning and ending with user; combined text content is limited to 12000 characters (image parts do not count toward this).
          items:
            $ref: "#/components/schemas/ChatMessage"
        turnstileToken:
          type: string
          maxLength: 2048
          description: Optional Turnstile token (`cf-turnstile-response` equivalent)
        cf-turnstile-response:
          type: string
          maxLength: 2048
          description: Turnstile token alias
        conversationId:
          type: string
          maxLength: 128
          description: |
            Optional client-generated opaque id (8-64 chars, [a-zA-Z0-9-]) used to persist this
            turn to D1 for later retrieval via GET /api/chat/history. Purely additive — omitting
            it (or sending a malformed value) changes nothing about how the request is answered,
            it just isn't logged. Never treated as an identity or session token.
        presetId:
          type: string
          maxLength: 128
          description: |
            Optional preset id. When present and resolvable (an approved preset, or the signed-in
            visitor's own), the Worker runs that preset's server-resolved multi-model pipeline
            instead of the default Hermes bridge; only the final step streams back. Never a
            client-supplied prompt — just an id the Worker resolves server-side.
    ContactRequest:
      type: object
      required: [email, message]
      properties:
        reason:
          type: string
          maxLength: 120
          example: General
        email:
          type: string
          format: email
          maxLength: 320
          example: person@example.com
        message:
          type: string
          maxLength: 6000
          example: Hello from the contact form.
        website:
          type: string
          description: Honeypot field (leave empty)
        company:
          type: string
          description: Honeypot field (leave empty)
        hp:
          type: string
          description: Honeypot field (leave empty)
        turnstileToken:
          type: string
          description: Optional Turnstile token (`cf-turnstile-response` equivalent)
    SubmitRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: person@example.com
        note:
          type: string
          maxLength: 6000
          example: Submission inquiry details.
        website:
          type: string
          description: Honeypot field (leave empty)
        company:
          type: string
          description: Honeypot field (leave empty)
        hp:
          type: string
          description: Honeypot field (leave empty)
        turnstileToken:
          type: string
          description: Optional Turnstile token (`cf-turnstile-response` equivalent)
    SubmissionUploadRequest:
      type: object
      additionalProperties: false
      required: [email, authorName, workTitle, consent, file]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        authorName:
          type: string
          maxLength: 120
        workTitle:
          type: string
          maxLength: 200
        genre:
          type: string
          maxLength: 80
        note:
          type: string
          maxLength: 6000
        consent:
          type: string
          enum: ["true", "on", "yes"]
          description: Confirms the submitter has authority to send the work and accepts email delivery.
        file:
          type: string
          format: binary
          description: One PDF, DOC, DOCX, ODT, RTF, TXT, or Markdown file; maximum 10 MiB.
        website:
          type: string
          description: Honeypot field (leave empty)
        turnstileToken:
          type: string
          maxLength: 2048
    UpdatesRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: subscriber@example.com
        source:
          type: string
          maxLength: 80
          example: index
        website:
          type: string
          description: Honeypot field (leave empty)
        company:
          type: string
          description: Honeypot field (leave empty)
        hp:
          type: string
          description: Honeypot field (leave empty)
        turnstileToken:
          type: string
          description: Optional Turnstile token (`cf-turnstile-response` equivalent)
    UpdatesImportRequest:
      allOf:
        - $ref: "#/components/schemas/UpdatesRequest"
        - type: object
          properties:
            name:
              type: string
              maxLength: 200
            stripe_plan:
              type: string
              maxLength: 120
            stripePlan:
              type: string
              maxLength: 120
            cancel_date:
              type: string
            cancelDate:
              type: string
            start_date:
              type: string
            startDate:
              type: string
            paid_upgrade_date:
              type: string
            paidUpgradeDate:
              type: string
            bestseller:
              type: integer
            emails_received_6mo:
              type: integer
            emailsReceived6mo:
              type: integer
            emails_dropped_6mo:
              type: integer
            emailsDropped6mo:
              type: integer
            num_emails_opened:
              type: integer
            numEmailsOpened:
              type: integer
            emails_opened_6mo:
              type: integer
            emailsOpened6mo:
              type: integer
            emails_opened_7d:
              type: integer
            emailsOpened7d:
              type: integer
            emails_opened_30d:
              type: integer
            emailsOpened30d:
              type: integer
            last_email_open:
              type: string
            lastEmailOpen:
              type: string
            links_clicked:
              type: integer
            linksClicked:
              type: integer
            last_clicked_at:
              type: string
            lastClickedAt:
              type: string
            unique_emails_seen_6mo:
              type: integer
            uniqueEmailsSeen6mo:
              type: integer
            unique_emails_seen_7d:
              type: integer
            uniqueEmailsSeen7d:
              type: integer
            unique_emails_seen_30d:
              type: integer
            uniqueEmailsSeen30d:
              type: integer
            post_views:
              type: integer
            postViews:
              type: integer
            post_views_7d:
              type: integer
            postViews7d:
              type: integer
            post_views_30d:
              type: integer
            postViews30d:
              type: integer
            unique_posts_seen:
              type: integer
            uniquePostsSeen:
              type: integer
            unique_posts_seen_7d:
              type: integer
            uniquePostsSeen7d:
              type: integer
            unique_posts_seen_30d:
              type: integer
            uniquePostsSeen30d:
              type: integer
            comments:
              type: integer
            comments_7d:
              type: integer
            comments7d:
              type: integer
            comments_30d:
              type: integer
            comments30d:
              type: integer
            shares:
              type: integer
            shares_7d:
              type: integer
            shares7d:
              type: integer
            shares_30d:
              type: integer
            shares30d:
              type: integer
            subscriptions_gifted:
              type: integer
            subscriptionsGifted:
              type: integer
            first_paid_date:
              type: string
            firstPaidDate:
              type: string
            revenue:
              type: string
            subscription_source_free:
              type: string
              maxLength: 120
            subscriptionSourceFree:
              type: string
              maxLength: 120
            subscription_source_paid:
              type: string
              maxLength: 120
            subscriptionSourcePaid:
              type: string
              maxLength: 120
            days_active_30d:
              type: integer
            daysActive30d:
              type: integer
            activity:
              type: integer
            country:
              type: string
              maxLength: 12
            state_province:
              type: string
              maxLength: 80
            stateProvince:
              type: string
              maxLength: 80
            expiration_date:
              type: string
            expirationDate:
              type: string
            type:
              type: string
              maxLength: 80
            sections:
              type: string
              maxLength: 400
    UpdatesUnsubscribeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: subscriber@example.com
        turnstileToken:
          type: string
          description: Optional Turnstile token (`cf-turnstile-response` equivalent)
    DonationSessionRequest:
      type: object
      properties:
        amount:
          type: string
          description: Dollar amount string. Minimum is 5.00 and maximum is 1000.00.
          example: "25"
        amountCents:
          type: integer
          description: Donation amount in cents. Minimum is 500 and maximum is 100000.
          minimum: 500
          maximum: 100000
        amount_cents:
          type: integer
          description: Snake-case alias for `amountCents`.
          minimum: 500
          maximum: 100000
        turnstileToken:
          type: string
          description: Optional Turnstile token (`cf-turnstile-response` equivalent)
    ContactSuccess:
      type: object
      additionalProperties: false
      required: [ok, id]
      properties:
        ok:
          type: boolean
          const: true
        id:
          type: string
          pattern: "^CONTACT-"
          example: CONTACT-MTBYS6-YQWCQP6X9Q
    SubmitSuccess:
      type: object
      additionalProperties: false
      required: [ok, id]
      properties:
        ok:
          type: boolean
          const: true
        id:
          type: string
          pattern: "^SUBMIT-"
          example: SUBMIT-MTBYTJ-3QWP1SK8FN
        filename:
          type: string
          description: Sanitized attachment filename when a multipart manuscript was included
    UpdatesSuccess:
      type: object
      additionalProperties: false
      required: [ok, alreadySignedUp]
      properties:
        ok:
          type: boolean
          const: true
        alreadySignedUp:
          type: boolean
          description: True when the email was already present before this request.
    UpdatesUnsubscribeSuccess:
      type: object
      additionalProperties: false
      required: [ok, unsubscribed]
      properties:
        ok:
          type: boolean
          const: true
        unsubscribed:
          type: boolean
          const: true
    DonationSessionSuccess:
      type: object
      additionalProperties: false
      required: [ok, amountCents, sessionId, url]
      properties:
        ok:
          type: boolean
          const: true
        amountCents:
          type: integer
          minimum: 500
          maximum: 100000
        sessionId:
          type: string
          example: cs_test_123
        url:
          type: string
          format: uri
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          examples:
            - Invalid JSON
            - Missing fields
            - Server not configured
            - Updates list not configured
            - Turnstile verification failed
            - Internal server error
    RateLimitErrorResponse:
      type: object
      additionalProperties: false
      required: [ok, error, retryAfter]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          const: Too many requests
        retryAfter:
          type: integer
          minimum: 1
    HealthSuccess:
      type: object
      additionalProperties: false
      required: [ok, service, dbConfigured, dbReachable, resendConfigured, stripeConfigured, storefrontConfigured, importConfigured, ownerAuthConfigured, now]
      properties:
        ok:
          type: boolean
          const: true
        service:
          type: string
          const: communications-worker
        dbConfigured:
          type: boolean
        dbReachable:
          type: boolean
        resendConfigured:
          type: boolean
        stripeConfigured:
          type: boolean
        storefrontConfigured:
          type: boolean
        importConfigured:
          type: boolean
        ownerAuthConfigured:
          type: boolean
        now:
          type: string
          format: date-time
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    AdminLoginSuccess:
      type: object
      additionalProperties: false
      required: [ok, sent]
      properties:
        ok:
          type: boolean
          const: true
        sent:
          type: boolean
          const: true
    AdminMeSuccess:
      type: object
      additionalProperties: false
      required: [ok, authenticated]
      properties:
        ok:
          type: boolean
          const: true
        authenticated:
          type: boolean
    AdminLogoutSuccess:
      type: object
      additionalProperties: false
      required: [ok, loggedOut]
      properties:
        ok:
          type: boolean
          const: true
        loggedOut:
          type: boolean
          const: true
    AdminRowsSuccess:
      type: object
      additionalProperties: false
      required: [ok, rows]
      properties:
        ok:
          type: boolean
          const: true
        rows:
          type: array
          items:
            type: object
    ChatHistorySuccess:
      type: object
      additionalProperties: false
      required: [ok, messages]
      properties:
        ok:
          type: boolean
          const: true
        messages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, content, created_at]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                description: Plain text only — image attachments are stored as a "[image attached]" placeholder, never as image bytes.
              created_at:
                type: string
                format: date-time
    ProjectEntry:
      type: object
      additionalProperties: false
      required:
        - project_slug
        - program_key
        - series_key
        - series_title
        - author
        - title
        - status
        - sort_order
      properties:
        project_slug:
          type: string
        program_key:
          type: string
        series_key:
          type: string
        series_title:
          type: string
        cluster_key:
          type: string
          nullable: true
        cluster_title:
          type: string
          nullable: true
        author:
          type: string
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        publication_year:
          type: integer
          nullable: true
        status:
          type: string
          enum: [concept, planned, in_progress, forthcoming, published]
        sort_order:
          type: integer
        notes:
          type: string
          nullable: true
        cover_image:
          type: string
          nullable: true
        popup_description:
          type: string
          nullable: true
        buy_url:
          type: string
          nullable: true
        completion_percent:
          type: number
          minimum: 0
          maximum: 100
        published_at:
          type: string
          nullable: true
          description: Publication date when known.
    ProjectsSuccess:
      type: object
      additionalProperties: false
      required: [ok, program, totals, series, projects]
      properties:
        ok:
          type: boolean
          const: true
        program:
          type: object
          additionalProperties: false
          required: [key, title]
          properties:
            key:
              type: string
            title:
              type: string
        totals:
          type: object
          additionalProperties: false
          required: [volumes, series]
          properties:
            volumes:
              type: integer
            series:
              type: integer
        series:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, title, count]
            properties:
              key:
                type: string
              title:
                type: string
              count:
                type: integer
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectEntry"
    StorefrontCollection:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
    StorefrontProduct:
      type: object
      additionalProperties: false
      required: [id, name, slug, description, image, priceValue, priceCurrency]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        image:
          type: string
        priceValue:
          type: string
        priceCurrency:
          type: string
    StorefrontSuccess:
      type: object
      additionalProperties: false
      required: [ok, shop, collection, collections, products]
      properties:
        ok:
          type: boolean
          const: true
        shop:
          type: object
          additionalProperties: false
          required: [id, name, domain, url]
          properties:
            id:
              type: string
            name:
              type: string
            domain:
              type: string
            url:
              type: string
        collection:
          type: string
        collections:
          type: array
          items:
            $ref: "#/components/schemas/StorefrontCollection"
        products:
          type: array
          items:
            $ref: "#/components/schemas/StorefrontProduct"
tags:
  - name: chat
    description: Constrained public Hermes chat streaming
  - name: health
    description: Runtime probe operations
  - name: storefront
    description: Fourthwall storefront catalog operations
  - name: projects
    description: Canonical projects program operations
  - name: contact
    description: Contact form operations
  - name: submit
    description: Submission inquiry operations
  - name: donations
    description: Stripe Checkout donation operations
  - name: updates
    description: Updates signup capture operations
