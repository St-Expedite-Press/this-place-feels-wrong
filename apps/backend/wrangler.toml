name = "stexpedite-communications"
main = "src/profile-entry.ts"
compatibility_date = "2026-05-01"
routes = [
  { pattern = "stexpedite.press/api/*", zone_name = "stexpedite.press" },
  { pattern = "www.stexpedite.press/api/*", zone_name = "stexpedite.press" },
]

[vars]
# Use a verified sender domain in Resend.
FROM_EMAIL = "St. Expedite Press <no-reply@stexpedite.press>"
TO_EMAIL = "editor@stexpedite.press"
RATE_LIMIT_MAX = "20"
RATE_LIMIT_WINDOW_MS = "60000"
# The one address allowed to request an admin magic-link sign-in.
OWNER_EMAIL = "editor@stexpedite.press"
# Where /api/admin/verify redirects after a successful sign-in.
ADMIN_APP_URL = "https://admin.stexpedite.press"
# Where /api/visitor/verify redirects after a successful visitor sign-in.
CHAT_APP_URL = "https://chat.stexpedite.press"
# Maximum private Hermes assistants a visitor account may provision.
PROFILE_LIMIT_PER_ACCOUNT = "8"
# Legacy preset budget remains during the compatibility window only.
PRESET_STEP_BUDGET = "40"

# Secrets (set via `wrangler secret put <NAME>` — NOT in this file):
#   STRIPE_SECRET_KEY      — Stripe API key for checkout session creation
#   STRIPE_WEBHOOK_SECRET  — Stripe webhook signing secret (whsec_...)
#   RESEND_API_KEY         — Resend API key for transactional email
#   FOURTHWALL_API_KEY     — Fourthwall storefront API key
#   TURNSTILE_SECRET       — Cloudflare Turnstile secret
#   UPDATES_IMPORT_TOKEN   — Bearer token for /api/updates/import
#   OPENROUTER_API_KEY     — legacy preset pipeline + graph extraction only; remove after preset cutover
#   HERMES_PROFILE_SERVICE_KEY — Worker-to-profile-service bearer token

# Public Hermes bridge. HERMES_API_URL/HERMES_API_KEY remain as the default-profile
# fallback until the profile service is deployed and verified.
#   HERMES_API_URL             — current stexpedite-public chat-completions endpoint
#   HERMES_API_KEY             — current stexpedite-public bearer token
#   HERMES_PROFILE_SERVICE_URL — private authenticated profile service origin

[[d1_databases]]
binding = "DB"
database_name = "stexpedite-updates"
database_id = "3bf56a30-c0cc-4b0f-a82a-caf740623af6"

[triggers]
# Daily chat-history retention purge (see scheduled() in src/index.ts).
crons = ["0 9 * * *"]
