name = "stexpedite-communications"
main = "src/index.ts"
compatibility_date = "2026-05-01"
routes = [
  { pattern = "stexpedite.press/api/*", zone_name = "stexpedite.press" },
  { pattern = "www.stexpedite.press/api/*", zone_name = "stexpedite.press" },
]

[vars]
# Use a verified sender domain in Resend.
FROM_EMAIL = "St. Expedite Press <no-reply@stexpedite.press>"
TO_EMAIL = "editor@stexpedite.press"
RATE_LIMIT_MAX = "20"
RATE_LIMIT_WINDOW_MS = "60000"

# Secrets (set via `wrangler secret put <NAME>` — NOT in this file):
#   STRIPE_SECRET_KEY      — Stripe API key for checkout session creation
#   STRIPE_WEBHOOK_SECRET  — Stripe webhook signing secret (whsec_...)
#   RESEND_API_KEY         — Resend API key for transactional email
#   FOURTHWALL_API_KEY     — Fourthwall storefront API key
#   TURNSTILE_SECRET       - Cloudflare Turnstile secret (required before public chat release)
#   UPDATES_IMPORT_TOKEN   - Bearer token for /api/updates/import

# Public chat bridge configuration (leave unset until the isolated public Hermes profile exists):
#   HERMES_API_URL         - non-secret full HTTPS chat-completions endpoint
#   HERMES_API_KEY         - dedicated public-profile bearer token (set with wrangler secret put)

[[d1_databases]]
binding = "DB"
database_name = "stexpedite-updates"
database_id = "3bf56a30-c0cc-4b0f-a82a-caf740623af6"
